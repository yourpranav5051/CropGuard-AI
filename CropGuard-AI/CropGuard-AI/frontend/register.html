<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — CropGuard AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="brand">🌱 CropGuard AI</div>
  <div>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
  </div>
</nav>

<div class="card">
  <h2>Create your account</h2>
  <div class="error-msg" id="errorMsg"></div>

  <form id="registerForm">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" required placeholder="e.g. Ramesh Patil">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
    </div>
    <button type="submit" class="btn" style="width:100%" id="submitBtn">Register</button>
  </form>

  <p class="form-footer">Already have an account? <a href="login.html">Login here</a></p>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById("errorMsg");
  const submitBtn = document.getElementById("submitBtn");
  errorMsg.classList.remove("visible");

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  submitBtn.disabled = true;
  submitBtn.textContent = "Creating account...";

  try {
    await apiRequest("/api/auth/register", {
      method: "POST",
      body: { name, email, password },
    });
    // Auto-login right after registering
    const loginData = await apiRequest("/api/auth/login", {
      method: "POST",
      body: { email, password },
    });
    saveToken(loginData.access_token);
    window.location.href = "dashboard.html";
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.classList.add("visible");
    submitBtn.disabled = false;
    submitBtn.textContent = "Register";
  }
});
</script>

</body>
</html>
