<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result — CropGuard AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="brand">🌱 CropGuard AI</div>
  <div>
    <a href="dashboard.html">Dashboard</a>
    <a href="scan.html">Scan Crop</a>
    <a href="#" id="logoutLink">Logout</a>
  </div>
</nav>

<div class="container">
  <div class="result-card" id="resultCard">
    <p style="color:var(--muted)">Loading result...</p>
  </div>
  <div style="text-align:center;">
    <a href="scan.html" class="btn btn-secondary">Scan Another</a>
    <a href="dashboard.html" class="btn">Back to Dashboard</a>
  </div>
</div>

<script src="js/api.js"></script>
<script>
requireAuth();

document.getElementById("logoutLink").addEventListener("click", (e) => {
  e.preventDefault();
  clearToken();
  window.location.href = "login.html";
});

const raw = sessionStorage.getItem("lastResult");
const card = document.getElementById("resultCard");

if (!raw) {
  card.innerHTML = `<p style="color:var(--muted)">No recent scan found. Go scan a crop first.</p>`;
} else {
  const r = JSON.parse(raw);
  const confidencePct = Math.round(r.confidence * 100);

  card.innerHTML = `
    <div class="result-header">
      <div>
        <div style="color:var(--muted); font-size:0.9rem;">${r.crop_name}</div>
        <h2>${r.predicted_disease}</h2>
      </div>
      <span class="severity-badge severity-${r.severity}">${r.severity}</span>
    </div>

    <div>
      <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:var(--muted);">
        <span>Confidence</span><span>${confidencePct}%</span>
      </div>
      <div class="confidence-bar">
        <div class="confidence-fill" style="width:${confidencePct}%"></div>
      </div>
    </div>

    <div class="result-section">
      <h4>Recommendation</h4>
      <p>${r.recommendation}</p>
    </div>

    <div class="result-section" style="background:#fff8e1; padding:12px; border-radius:8px; margin-top:20px;">
      <p style="font-size:0.85rem; margin:0;">
        ⚠️ This is AI-assisted decision support, not a lab diagnosis.
        For uncertain or high-severity cases, please consult a local
        agriculture expert.
      </p>
    </div>
  `;
}
</script>

</body>
</html>
